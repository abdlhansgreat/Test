<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A clean, dependency-free Pomodoro timer to help you focus." />
  <meta name="theme-color" content="#ba4949" />
  <title>Pomodoro Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍅</text></svg>" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <h1 class="brand"><span class="brand-mark">🍅</span> Pomodoro</h1>
      <button class="icon-btn" id="settingsBtn" aria-label="Open settings" title="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M19.14 12.94a7.6 7.6 0 0 0 .05-.94 7.6 7.6 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.62l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7.3 7.3 0 0 0-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.74 8.86a.5.5 0 0 0 .12.62l2.03 1.58a7.6 7.6 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.62l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.58-.24 1.12-.56 1.62-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.62l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/>
        </svg>
      </button>
    </header>

    <main class="card">
      <nav class="modes" role="tablist" aria-label="Timer mode">
        <button class="mode-btn is-active" data-mode="focus" role="tab" aria-selected="true">Focus</button>
        <button class="mode-btn" data-mode="short" role="tab" aria-selected="false">Short Break</button>
        <button class="mode-btn" data-mode="long" role="tab" aria-selected="false">Long Break</button>
      </nav>

      <div class="timer">
        <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
          <circle class="ring-track" cx="110" cy="110" r="100" />
          <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="100" />
        </svg>
        <div class="timer-face">
          <div class="time" id="timeDisplay" aria-live="off">25:00</div>
          <div class="phase" id="phaseLabel">Time to focus</div>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="startPauseBtn">Start</button>
        <button class="btn btn-ghost" id="skipBtn" aria-label="Skip to next session" title="Skip">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
          </svg>
        </button>
        <button class="btn btn-ghost" id="resetBtn" aria-label="Reset timer" title="Reset">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/>
          </svg>
        </button>
      </div>

      <footer class="stats">
        <div class="stat">
          <span class="stat-value" id="roundCount">0</span>
          <span class="stat-label">Completed</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-value" id="cycleDots">#1</span>
          <span class="stat-label">Round</span>
        </div>
      </footer>
    </main>

    <p class="tagline" id="tagline">Stay focused. One pomodoro at a time.</p>
  </div>

  <!-- Settings dialog -->
  <div class="overlay" id="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="dialog-head">
        <h2 id="settingsTitle">Settings</h2>
        <button class="icon-btn" id="closeSettings" aria-label="Close settings">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M18.3 5.71 12 12l6.3 6.29-1.42 1.42L10.59 13.4 5.71 18.3 4.29 16.88 9.17 12 4.29 7.12 5.71 5.7l4.88 4.88L16.88 4.29z"/>
          </svg>
        </button>
      </div>

      <div class="dialog-body">
        <h3 class="group-title">Time (minutes)</h3>
        <div class="field-row">
          <label class="field">
            <span>Focus</span>
            <input type="number" id="focusInput" min="1" max="120" inputmode="numeric" />
          </label>
          <label class="field">
            <span>Short Break</span>
            <input type="number" id="shortInput" min="1" max="60" inputmode="numeric" />
          </label>
          <label class="field">
            <span>Long Break</span>
            <input type="number" id="longInput" min="1" max="60" inputmode="numeric" />
          </label>
        </div>

        <h3 class="group-title">Behavior</h3>
        <label class="field">
          <span>Rounds before long break</span>
          <input type="number" id="intervalInput" min="2" max="12" inputmode="numeric" />
        </label>

        <label class="toggle">
          <input type="checkbox" id="autoStartBreaks" />
          <span class="toggle-track" aria-hidden="true"></span>
          <span>Auto-start breaks</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="autoStartPomodoros" />
          <span class="toggle-track" aria-hidden="true"></span>
          <span>Auto-start focus sessions</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="soundEnabled" />
          <span class="toggle-track" aria-hidden="true"></span>
          <span>Sound alert when a session ends</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="notifyEnabled" />
          <span class="toggle-track" aria-hidden="true"></span>
          <span>Desktop notifications</span>
        </label>
      </div>

      <div class="dialog-foot">
        <button class="btn btn-ghost" id="resetDefaults">Reset to defaults</button>
        <button class="btn btn-primary" id="saveSettings">Done</button>
      </div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
